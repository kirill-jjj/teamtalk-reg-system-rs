name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: ["Build Binaries"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible Dependabot PR
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.info("No pull request attached to this workflow_run.");
              return;
            }

            const prNumber = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.info(`PR #${pr.number} is not open.`);
              return;
            }
            if (pr.draft) {
              core.info(`PR #${pr.number} is draft.`);
              return;
            }
            if (pr.base.ref !== "main") {
              core.info(`PR #${pr.number} is not targeting main.`);
              return;
            }
            if (pr.user.login !== "app/dependabot") {
              core.info(`PR #${pr.number} is not from app/dependabot.`);
              return;
            }
            if (pr.mergeable_state === "dirty") {
              core.info(`PR #${pr.number} has merge conflicts.`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: "squash",
            });
            core.info(`Merged PR #${pr.number}.`);

            if (pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${pr.head.ref}`,
                });
                core.info(`Deleted branch ${pr.head.ref}.`);
              } catch (err) {
                core.info(`Branch cleanup skipped: ${err.message}`);
              }
            }
